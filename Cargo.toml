[package]
name = "soltty"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"

[dependencies]
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.14"
raw-window-handle = "0.6"
log = "0.4"
env_logger = "0.11"
portable-pty = "0.8"
vte = "0.13"
swash = "0.1"
etagere = "0.2"
clap = { version = "4", features = ["derive"] }
arboard = { version = "3", features = ["wayland-data-control"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev]
opt-level = 1
