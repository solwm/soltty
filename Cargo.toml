[workspace]
members = [".", "bench"]

[package]
name = "soltty"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"

[dependencies]
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.14"
raw-window-handle = "0.6"
log = "0.4"
env_logger = "0.11"
portable-pty = "0.8"
vte = "0.13"
swash = "0.1"
etagere = "0.2"
clap = { version = "4", features = ["derive"] }
arboard = { version = "3", features = ["wayland-data-control"] }
# Already transitive via winit; declared here so we can call them directly
# for the Wayland clipboard read path (replaces shelling out to wl-paste,
# which segfaults in wl-clipboard 2.3.0 on at least one user's setup).
[target.'cfg(unix)'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
# pipe2 + poll for the receive-fd path; std doesn't expose pipe() until 1.87
# and our MSRV is 1.80.
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev]
opt-level = 1
